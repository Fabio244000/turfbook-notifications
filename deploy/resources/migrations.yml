Resources:
  MigrationTrigger:
    Type: Custom::Migration
    Properties:
      ServiceToken:
        Fn::GetAtt: [MigrateLambdaFunction, Arn]
      ServiceTimeout: 120
      MigrationsHash: ${param:migrationsHash, sls:instanceId}
extensions:
  # Every Lambda that uses the database waits for the migrations (one entry each).
  NotifierLambdaFunction:
    DependsOn:
      - MigrationTrigger
