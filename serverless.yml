service: turfbook-notifications
frameworkVersion: '~4.43.0'

stages:
  default:
    params:
      privateSubnetA: subnet-0163ffcf34770d937
      privateSubnetB: subnet-0f44784a3de31da43
      lambdaDbSecurityGroup: sg-094dae12950b8a2e9

provider:
  name: aws
  runtime: python3.12
  architecture: arm64
  region: us-east-1
  logRetentionInDays: 7
  stackTags:
    project: turfbook
    service: turfbook-notifications
    stage: ${sls:stage}
  httpApi:
    payload: '2.0'
  iam:
    role:
      mode: perFunction
      permissionsBoundary: arn:aws:iam::${aws:accountId}:policy/turfbook-lambda-boundary
  environment: ${file(./deploy/env/${sls:stage}.yml)}

custom:
  pythonRequirements:
    fileName: requirements/base.txt
    layer: true
    dockerizePip: true

package:
  patterns:
    - '!./**'
    - 'app/**'
    - 'config/**'
    - 'alembic/**'
    - 'alembic.ini'

functions:
  api:
    handler: app.user_notification.main.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    events:
      - httpApi: '*'
    timeout: 15

  notifier:
    handler: app.user_notification.infrastructure.queue.handler.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    timeout: 10
    vpc:
      subnetIds:
        - ${param:privateSubnetA}
        - ${param:privateSubnetB}
      securityGroupIds:
        - ${param:lambdaDbSecurityGroup}
    events:
      - sqs:
          arn:
            Fn::GetAtt: [NoticesQueue, Arn]
          batchSize: 1
    iam:
      role:
        statements:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt: [NoticesDeadLetterQueue, Arn]
          - Effect: Allow
            Action: ses:SendEmail
            Resource: arn:aws:ses:${aws:region}:${aws:accountId}:identity/${ssm:/turfbook/notifications/${sls:stage}/ses_sender}

  migrate:
    handler: app.migrations.handler.handler
    layers:
      - Ref: PythonRequirementsLambdaLayer
    timeout: 30
    maximumRetryAttempts: 0
    vpc:
      subnetIds:
        - ${param:privateSubnetA}
        - ${param:privateSubnetB}
      securityGroupIds:
        - ${param:lambdaDbSecurityGroup}

resources:
  - ${file(./deploy/resources/http-api.yml)}
  - ${file(./deploy/resources/migrations.yml)}
  - ${file(./deploy/resources/notices.yml)}
